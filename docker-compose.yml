services:
  taskmesh:
    build:
      context: .
      dockerfile: Dockerfile
    image: taskmesh:latest
    container_name: taskmesh-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TASKMESH_PORT=8080
      - TASKMESH_HOST=0.0.0.0
      - TASKMESH_WORKERS=4
      - TASKMESH_DB_PATH=/data/taskmesh.db
      - TASKMESH_API_KEY=${TASKMESH_API_KEY:-tm_prod_secret_key_2026}
    volumes:
      - taskmesh_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  taskmesh_data:
    name: taskmesh_durable_data
