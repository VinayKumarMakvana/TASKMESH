# fly.toml app configuration file for TaskMesh
# See https://fly.io/docs/reference/configuration/ for information.

app = "taskmesh-engine"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  TASKMESH_HOST = "0.0.0.0"
  TASKMESH_PORT = "8080"
  TASKMESH_DB_PATH = "/data/taskmesh.db"
  TASKMESH_WORKERS = "4"

# Mount persistent NVMe volume to preserve SQLite database and WAL across restarts
[mounts]
  source = "taskmesh_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 500

[[http_service.checks]]
  interval = "15s"
  timeout = "3s"
  grace_period = "10s"
  method = "GET"
  path = "/health"
